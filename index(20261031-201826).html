<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIL MURA AI | Қонақтар дауысы</title><style>:root{font-family:system-ui,Arial;background:#101c2c;color:#f7e9cc}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#344456,#101c2c 70%)}main{max-width:720px;margin:auto;padding:28px 18px}.card{border:1px solid #c9a45b;border-radius:22px;background:#18293c;padding:25px;box-shadow:0 15px 50px #0004}h1{text-align:center;color:#f5d48c;margin-bottom:5px}h2{text-align:center;font-size:19px}p{text-align:center;color:#d6d2c8}.orn{text-align:center;color:#d5aa60;font-size:28px;letter-spacing:12px}label{display:block;margin:20px 0 9px;font-weight:600}button,select,textarea{font:inherit}button{cursor:pointer}.stars{display:flex;justify-content:center;gap:12px}.star{background:none;border:0;font-size:40px;color:#6f7680}.star.on{color:#f4c65e}select,textarea{box-sizing:border-box;width:100%;border:1px solid #aa956c;background:#0f1c2c;color:white;border-radius:12px;padding:13px}textarea{min-height:90px}.submit{width:100%;padding:15px;background:#d4aa5f;color:#142033;border:0;border-radius:12px;font-weight:800;margin-top:22px}.note{font-size:12px}.bar{background:#39485b;border-radius:8px;overflow:hidden;height:14px}.fill{background:#e8bf70;height:100%}.result{margin:18px 0}.top{display:flex;justify-content:space-between}.hidden{display:none}a{color:#f0cf8b}#status{text-align:center;margin-top:12px}</style></head><body><main><div class="orn">❖ ۞ ❖</div><h1>TIL MURA AI</h1><h2>«Сөз өнері» — Қонақтар дауысы</h2><div class="card" id="vote"><p>Платформамен танысқаныңыз үшін рақмет! Өз бағаңызды беріңіз.</p><label>Платформа сізге қаншалықты ұнады?</label><div class="stars" id="stars"></div><label for="section">Қай бөлім ерекше ұнады?</label><select id="section"><option value="">Бөлімді таңдаңыз</option><option>Өлең жаттау</option><option>Мәнерлеп оқу</option><option>Эссе жазу</option><option>Өлең шығару</option><option>ЖИ арқылы бағалау</option></select><label for="comment">Ұсынысыңыз (міндетті емес)</label><textarea id="comment" maxlength="500" placeholder="Пікіріңізді жазыңыз..."></textarea><button class="submit" id="send">Дауыс беру</button><div id="status"></div><p class="note">Тіркелу қажет емес. Бір браузерден бір дауыс.</p></div><div class="card hidden" id="results"><h2>Қонақтар бағалауы · LIVE</h2><h1 id="avg">—</h1><p>Орташа баға · <span id="count">0</span> дауыс</p><div id="bars"></div><p class="note">Нәтижелер автоматты жаңарады.</p></div><p><a href="?results=1">Үлкен экрандағы нәтижелер</a></p><div class="orn">❖ ۞ ❖</div></main><script>
// SETUP: Replace these two placeholders with your own Supabase project values.
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';const TABLE='til_mura_guest_votes';
const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');const headers={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'};const sections=['Өлең жаттау','Мәнерлеп оқу','Эссе жазу','Өлең шығару','ЖИ арқылы бағалау'];let rating=0;const starbox=document.getElementById('stars');for(let n=1;n<=5;n++){const b=document.createElement('button');b.className='star';b.textContent='★';b.setAttribute('aria-label',n+' жұлдыз');b.onclick=()=>{rating=n;[...starbox.children].forEach((el,i)=>el.classList.toggle('on',i<n))};starbox.appendChild(b)}const isResults=new URLSearchParams(location.search).has('results');if(isResults){document.getElementById('vote').classList.add('hidden');document.getElementById('results').classList.remove('hidden')}else if(localStorage.getItem('til_mura_voted')){document.getElementById('vote').innerHTML='<h2>Рақмет! Дауысыңыз қабылданды.</h2><p>Пікіріңіз біз үшін маңызды.</p>'}async function api(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{...headers,...options.headers}});if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:r.json()}document.getElementById('send')?.addEventListener('click',async()=>{const status=document.getElementById('status');const section=document.getElementById('section').value;if(!rating||!section){status.textContent='Жұлдызды және бөлімді таңдаңыз.';return}if(!ready){status.textContent='Алдымен Supabase баптауларын енгізу қажет.';return}if(localStorage.getItem('til_mura_voted'))return;const btn=document.getElementById('send');btn.disabled=true;try{await api(TABLE,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({rating,section,comment:document.getElementById('comment').value.trim()})});localStorage.setItem('til_mura_voted','1');document.getElementById('vote').innerHTML='<h2>Рақмет! Дауысыңыз қабылданды.</h2><p>Пікіріңіз біз үшін маңызды.</p>'}catch(e){status.textContent='Дауыс жіберілмеді. Байланысты тексеріңіз.';btn.disabled=false}});async function refresh(){if(!isResults)return;if(!ready){document.getElementById('bars').textContent='Supabase қосылымын баптаңыз.';return}try{const rows=await api(TABLE+'?select=rating,section&limit=10000');const count=rows.length;document.getElementById('count').textContent=count;document.getElementById('avg').textContent=count?(rows.reduce((a,r)=>a+Number(r.rating),0)/count).toFixed(1)+' ★':'—';const bars=document.getElementById('bars');bars.replaceChildren();for(const name of sections){const n=rows.filter(r=>r.section===name).length;const pct=count?Math.round(n/count*100):0;const wrap=document.createElement('div');wrap.className='result';const top=document.createElement('div');top.className='top';const title=document.createElement('span');title.textContent=name;const percent=document.createElement('span');percent.textContent=pct+'%';top.append(title,percent);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);wrap.append(top,bar);bars.append(wrap)}}catch(e){document.getElementById('bars').textContent='Нәтижелерді жүктеу мүмкін болмады.'}}refresh();if(isResults)setInterval(refresh,3000);
</script></body></html>
